// =====================================================================
//  jakeapotamus - CS2 LAN autoexec
//  Generated 2026-11-11 from this PC's live CS2 config
//
//  INSTALL:  copy to  ...\Counter-Strike Global Offensive\game\csgo\cfg\
//  RUN:      Steam launch option  +exec autoexec   (or type  exec autoexec  in console)
// =====================================================================

// ---------------------------------------------------------------------
//  MOUSE  (remember to set your mouse DPI to match home!)
// ---------------------------------------------------------------------
sensitivity "1.2"
zoom_sensitivity_ratio "1"
m_pitch "0.022"
m_yaw "0.022"
mouse_inverty "0"

// ---------------------------------------------------------------------
//  CROSSHAIR
// ---------------------------------------------------------------------
// (exact values from your saved config; CS2's pixel-based crosshair)
crosshair "1"
cl_crosshairstyle "3"
cl_crosshair_screen_height "2160"
cl_crosshair_gap "7"
cl_crosshair_length "8"
cl_crosshair_thickness "3"
cl_crosshairsize "2"
cl_crosshairthickness "0.559525"
cl_crosshairdot "0"
cl_crosshair_t "0"
cl_crosshair_recoil "0"
cl_crosshaircolor_r "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "255"
cl_crosshaircolor_a "255"
cl_crosshairalpha "255"
cl_crosshair_drawoutline "1"
cl_crosshairoutline_r "29"
cl_crosshairoutline_g "255"
cl_crosshairoutline_b "10"
cl_crosshairoutline_a "255"
cl_crosshair_dynamic_splitdist "6"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.3"
cl_crosshair_dynamic_maxdist_splitratio "0"
cl_crosshair_dynamic_spread_limit "255"
cl_crosshair_sniper_width "1"
cl_crosshair_friendly_warning "1"
cl_ironsight_usecrosshaircolor "0"
cl_ironsight_dot_scale "1"

// Grenade crosshair
cl_grenadecrosshair_keepusercrosshair "1"
cl_grenadecrosshair_explosive "1"
cl_grenadecrosshair_flash "1"
cl_grenadecrosshair_smoke "1"
cl_grenadecrosshair_fire "1"
cl_grenadecrosshair_decoy "1"
cl_grenadecrosshairdelay_explosive "2"
cl_grenadecrosshairdelay_flash "2"
cl_grenadecrosshairdelay_smoke "0"
cl_grenadecrosshairdelay_fire "2"
cl_grenadecrosshairdelay_decoy "2"

// ---------------------------------------------------------------------
//  VIEWMODEL
// ---------------------------------------------------------------------
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-1.5"
cl_prefer_lefthanded "0"

// ---------------------------------------------------------------------
//  GAMEPLAY
// ---------------------------------------------------------------------
cl_sniper_auto_rezoom "1"
cl_sniper_delay_unscope "0"
cl_debounce_zoom "1"
cl_silencer_mode "0"
cl_use_opens_buy_menu "1"
cl_showloadout "1"
cl_weapon_stealth_reload_toggle "0"
cl_inventory_radial_immediate_select "1"
cl_inventory_radial_tap_to_cycle "1"
cl_use_last_selected_weapon_slot_position "0"
cl_buywheel_nonumberpurchasing "0"
hud_fastswitch "0"
option_duck_method "0"
option_speed_method "0"
cl_radial_radio_tap_to_ping "1"
cl_predict_body_shot_fx "0"
cl_predict_head_shot_fx "0"
cl_predict_kill_ragdolls "1"

// ---------------------------------------------------------------------
//  HUD
// ---------------------------------------------------------------------
hud_scaling "1"
cl_hud_color "2"
hud_showtargetid "1"
cl_teammate_colors_show "1"
cl_teamid_overhead_mode "3"
cl_teamid_overhead_colors_show "1"
cl_teamid_overhead_fade_near_crosshair "0.75"
cl_teamcounter_playercount_instead_of_avatars "1"
cl_show_clan_in_death_notice "1"
cl_weapon_selection_rarity_color "1"
cl_sniper_show_inaccuracy "1"
cl_hud_telemetry_frametime_show "1"
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_net_misdelivery_show "1"
r_drawtracers_firstperson "1"
closecaption "0"
cc_subtitles "0"

// ---------------------------------------------------------------------
//  RADAR
// ---------------------------------------------------------------------
cl_radar_scale "1"
cl_hud_radar_scale "1"
cl_radar_rotate "1"
cl_radar_always_centered "0"
cl_radar_scale_dynamic "1"
cl_radar_icon_scale_min "0.6"
cl_radar_square_with_scoreboard "1"
cl_radar_square_always "0"
cl_hud_radar_background_alpha "1"
cl_hud_radar_blur_background "1"
cl_hud_radar_map_additive "1"

// ---------------------------------------------------------------------
//  AUDIO
// ---------------------------------------------------------------------
volume "1"
snd_voipvolume "0.681594"
snd_headphone_eq "2"
snd_spatialize_lerp "0"
snd_steamaudio_enable_perspective_correction "1"
snd_mute_losefocus "1"
snd_musicvolume "0"
snd_menumusic_volume "0"
snd_roundstart_volume "0"
snd_roundend_volume "0.034941"
snd_roundaction_volume "0.009733"
snd_mvp_volume "0.038207"
snd_mapobjective_volume "0.04"
snd_tensecondwarning_volume "0.04"
snd_deathcamera_volume "0"
snd_mute_mvp_music_live_players "0"

// Voice (open mic off, push-to-talk on MOUSE4)
voice_modenable "1"
voice_vox "0"
voice_threshold "-120"

// ---------------------------------------------------------------------
//  NETWORK / PERFORMANCE / DISPLAY
// ---------------------------------------------------------------------
rate "786432"
cl_net_buffer_ticks "0"
fps_max "0"
fps_max_ui "244"
engine_no_focus_sleep "20"
r_fullscreen_gamma "1.99"
r_player_visibility_mode "1"
con_enable "1"
cl_showfps "0"
cl_join_advertise "0"

// ---------------------------------------------------------------------
//  BINDS  (full set, so leftover binds on the LAN PC don't interfere)
// ---------------------------------------------------------------------
// Movement
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "SPACE" "+jump"
bind "MWHEELDOWN" "+jump"
bind "SHIFT" "+duck"
bind "CAPSLOCK" "+sprint"
unbind "CTRL"

// Weapons / actions
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"
bind "MWHEELUP" "invprev"
bind "e" "+use"
bind "r" "+reload"
bind "f" "+lookatweapon"
bind "g" "drop"
bind "q" "lastinv"
bind "h" "switchhands"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
unbind "7"
unbind "8"
bind "9" "slot9"
bind "z" "slot7"
bind "x" "slot8"
bind "c" "slot6"
bind "v" "slot10"

// Buying
bind "b" "buymenu"
bind "0" "buy flashbang;buy hegrenade;buy smokegrenade;buy molotov;buy incgrenade;"
bind "," "buyammo1"
bind "." "buyammo2"
bind "F3" "autobuy"
bind "F4" "rebuy"
bind "DEL" "sellbackall"

// Comms / UI
bind "MOUSE4" "+voicerecord"
bind "TAB" "+showscores"
bind "y" "messagemode"
bind "i" "messagemode2"
bind "k" "+spray_menu"
unbind "t"
bind "m" "teammenu"
bind "u" "toggle spec_show_xray"
bind "n" "noclip"
bind "`" "toggleconsole"
bind "ESCAPE" "cancelselect"
bind "F5" "say (╭☞ ͡° ͜ʖ ͡° )╭☞ ｄｏｎｔ　ｔａｌｋｉｎｇ　ｐｌｅａｓｅ (╭☞ ͡° ͜ʖ ͡° )╭☞"
bind "F10" "cs_quit_prompt"

// =====================================================================
//  VIDEO SETTINGS - can't be set from a cfg, set these in the menu:
//    Home values from cs2_video.txt (* = menu name is my best reading)
//    Resolution ........ 3840x2160 at home - use the LAN monitor's native res
//    Display mode ...... windowed + no border = Fullscreen Windowed *
//    V-Sync ............ ON          NVIDIA Reflex ...... On + Boost *
//    Multisampling ..... 4x MSAA     CMAA ............... off
//    Shader detail ..... Low *       Shadow quality ..... lowest setting
//    Dynamic shadows ... Sun only/1 *  Parallax occlusion .. off
//    Texture detail .... 2 (High) *  Texture filtering .. level 2 *
//    Particle detail ... 2 (High) *  Ambient occlusion .. 2 (High) *
//    FSR ............... off         HDR ................ -1 (Performance) *
//    Brightness ........ r_fullscreen_gamma 1.99 (set above)
// =====================================================================

host_writeconfig
echo "------------------------------------"
echo "-- jakeapotamus LAN config loaded --"
echo "------------------------------------"
