// Viewmodel
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-1.5"

// HUD & radar
cl_radar_scale "1"
cl_hud_radar_scale "1"
cl_radar_always_centered "0"
cl_showfps "0"

// Network & performance
rate "786432"
fps_max "0"
cl_join_advertise "0"

bind z "slot7"
bind x "slot8"
bind c "slot6"
bind v "slot10"

echo "---------------------"
echo "----config loaded----"
echo "---------------------"


host_writeconfig
